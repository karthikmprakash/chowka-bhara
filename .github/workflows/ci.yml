name: CI

# Every pull request and every push to main must pass the same gate:
# type, lint, test, build, and a real room socket round trip.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  web:
    name: Web · type, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Keep the build for the integration job
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: game/dist
          retention-days: 2

  rooms:
    name: Room API · live socket round trip
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Install
        run: npm ci
      - name: Start the dev server
        run: |
          npm run dev > "$RUNNER_TEMP/dev.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/dev.pid"
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:5173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "The dev server did not answer within 180s."
          tail -80 "$RUNNER_TEMP/dev.log"
          exit 1
      - name: Room integration tests
        run: npm run test:rooms
      - name: Server log
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/dev.pid" ]; then kill "$(cat "$RUNNER_TEMP/dev.pid")" 2>/dev/null || true; fi
          tail -60 "$RUNNER_TEMP/dev.log" || true

  android:
    name: Android · debug assembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            game/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the shell
        run: npm ci
      - name: Build the web assets the shell bundles
        working-directory: game
        run: |
          npm ci
          npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Assemble the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
