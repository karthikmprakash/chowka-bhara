name: Release

# A semver tag is the release switch: v1.2.3 builds a signed Android bundle,
# deploys the web app at that tag, uploads to the Play internal track as a
# draft, and publishes a GitHub release with the artifacts.

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PACKAGE_NAME: com.chowkabara.game
  PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

jobs:
  android:
    name: Android · signed bundle and Play upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tags must look like v1.2.3 (received $GITHUB_REF_NAME)."
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$tag"
          code=$(( major * 1000000 + minor * 1000 + patch ))
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (versionCode $code)"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            game/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Install the shell
        run: npm ci
      - name: Build the web assets the shell bundles
        working-directory: game
        run: |
          npm ci
          npm run build
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Write the release signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret ANDROID_$name."
              exit 1
            fi
          done
          umask 077
          # The Gradle project reads both files from android/app/.
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat > android/app/keystore.properties <<PROPERTIES
          CHOWKA_STORE_FILE=release.keystore
          CHOWKA_STORE_PASSWORD=$STORE_PASSWORD
          CHOWKA_KEY_ALIAS=$KEY_ALIAS
          CHOWKA_KEY_PASSWORD=$KEY_PASSWORD
          PROPERTIES

      - name: Build the signed bundle and APK
        working-directory: android
        run: >-
          ./gradlew bundleRelease assembleRelease --no-daemon
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Verify the artifacts
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$aab" || { echo "::error::Missing $aab"; exit 1; }
          test -s "$apk" || { echo "::error::Missing $apk"; exit 1; }
          ls -lh "$aab" "$apk"

      - name: Keep the release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.version.outputs.name }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk

      # Uploads a draft to internal testing. A human promotes it in the Play
      # Console, which is the deliberate step before any public rollout.
      - name: Upload to Google Play (internal, draft)
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk

  web:
    name: Web · deploy at tag
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://chowka-bara.mkarthikprakash-work.workers.dev
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: game
          command: deploy --config dist/server/wrangler.json
